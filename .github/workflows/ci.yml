name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          for p in linux/amd64 linux/arm64 windows/amd64 darwin/arm64 darwin/amd64 freebsd/amd64; do
            GOOS=${p%/*} GOARCH=${p#*/} go build -o /dev/null ./cmd/phoedox-agent
          done
